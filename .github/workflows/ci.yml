name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # No API key is set here, on purpose: every test runs offline.
        run: pytest -q

      - name: Pipeline smoke test on the fake model
        # Assert the outcome, not just the exit code: a run where every output
        # was flagged still exits 0.
        #
        # GROUNDING_CHECK is off here because the fake model invents its quiz
        # options by design (41%, 4%, 0%), and the code-level number check
        # correctly flags them. The check itself is tested in tests/test_checks.py.
        env:
          GROUNDING_CHECK: "false"
        run: |
          python scripts/cli.py evals/testset/01_water_budget.txt --fake \
            --outputs summary quiz --no-save --no-write | tee smoke.txt
          grep -q '^status: ok$' smoke.txt
          grep -qE 'summary +5/5' smoke.txt

      - name: Evaluation harness on the fake model
        run: python evals/run_eval.py --fake --limit 2
