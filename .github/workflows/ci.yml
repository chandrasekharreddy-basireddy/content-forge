name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # No API key is set here, on purpose: every test runs offline.
        run: pytest -q

      - name: Pipeline smoke test on the fake model
        run: python scripts/cli.py evals/testset/01_water_budget.txt --fake --outputs summary quiz --no-save
